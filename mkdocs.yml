site_name: Axon Framework
site_description: "Build Agentic AI Systems in minutes. Now with Multi-Agent Swarms! 🐝"
site_url: https://github.com/ilakhunov/axon
repo_url: https://github.com/ilakhunov/axon
repo_name: ilakhunov/axon

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.expand

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Guides: guides.md
  - Reference: reference.md
  - Explanation: explanation.md
